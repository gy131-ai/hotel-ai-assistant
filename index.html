<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    if (new URLSearchParams(window.location.search).get("embed") === "1") {
      document.documentElement.classList.add("is-embedded");
    }
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="酒店AI助手">
  <meta name="theme-color" content="#f4f7fb">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <title>酒店AI助手｜MVP交互原型</title>
  <style>
    :root {
      --canvas: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #14243a;
      --ink-soft: #53647a;
      --muted: #8794a5;
      --line: rgba(20, 36, 58, 0.10);
      --line-strong: rgba(20, 36, 58, 0.16);
      --navy: #173253;
      --blue: #356af4;
      --blue-soft: #edf3ff;
      --green: #3f8f75;
      --green-soft: #e8f4ef;
      --violet: #6d72b8;
      --violet-soft: #eff0fb;
      --teal: #438a91;
      --teal-soft: #eaf5f5;
      --coral: #c86e63;
      --coral-soft: #faece9;
      --shadow: 0 24px 70px rgba(23, 50, 83, 0.18);
      --card-shadow: 0 10px 28px rgba(23, 50, 83, 0.055);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dfe4eb;
    }

    body {
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid rgba(53, 106, 244, 0.45);
      outline-offset: 2px;
    }

    [hidden] { display: none !important; }

    #app {
      width: 100vw;
      height: calc(100vh - 76px);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--canvas);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    html.is-embedded #prototype-tools { display: none !important; }

    html.is-embedded #app {
      width: 100vw;
      height: 100vh;
    }

    .screen {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: screen-in 180ms ease-out;
    }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      padding-bottom: 24px;
    }

    .scroll::-webkit-scrollbar { display: none; }

    .page-top {
      min-height: 64px;
      padding: 12px 18px 8px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 247, 251, 0.92);
      backdrop-filter: blur(18px);
    }

    .page-top h1 {
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      font-weight: 760;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
    }

    .icon-btn:active { background: rgba(20, 36, 58, 0.06); }

    .arrow-left {
      width: 10px;
      height: 10px;
      border-left: 1.8px solid currentColor;
      border-bottom: 1.8px solid currentColor;
      transform: rotate(45deg);
    }

    .close-x {
      width: 16px;
      height: 16px;
      position: relative;
    }

    .close-x::before,
    .close-x::after {
      content: "";
      width: 17px;
      height: 1.6px;
      position: absolute;
      left: 0;
      top: 7px;
      border-radius: 99px;
      background: currentColor;
    }

    .close-x::before { transform: rotate(45deg); }
    .close-x::after { transform: rotate(-45deg); }

    .home-head {
      padding: 17px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hotel-switcher {
      min-width: 0;
      min-height: 52px;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .hotel-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(53, 106, 244, 0.22);
      border-radius: 15px;
      color: #eaf0ff;
      background: var(--navy);
      box-shadow: 0 8px 18px rgba(23, 50, 83, 0.14);
      font-family: Georgia, "Songti SC", serif;
      font-size: 16px;
      font-weight: 650;
    }

    .hotel-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hotel-copy {
      min-width: 0;
    }

    .hotel-title {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .hotel-title strong {
      max-width: 206px;
      overflow: hidden;
      font-size: 18px;
      font-weight: 780;
      letter-spacing: -0.035em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .chevron {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-right: 1.5px solid var(--ink-soft);
      border-bottom: 1.5px solid var(--ink-soft);
      transform: rotate(45deg) translateY(-2px);
    }

    .hotel-copy small {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .brand-chip {
      min-width: 44px;
      height: 30px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(53, 106, 244, 0.15);
      border-radius: 999px;
      color: var(--blue);
      background: var(--blue-soft);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: 0.02em;
    }

    .content {
      padding: 7px 18px 28px;
    }

    .section + .section { margin-top: 27px; }

    .section-title {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 780;
      letter-spacing: -0.03em;
    }

    .section-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .count {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .app-list {
      display: grid;
      gap: 11px;
    }

    .app-card {
      --accent: var(--blue);
      --soft: var(--blue-soft);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }

    .app-card-head {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .app-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: 13px;
      color: var(--accent);
      background: var(--soft);
      font-size: 15px;
      font-weight: 800;
    }

    .app-name {
      min-width: 0;
      flex: 1;
    }

    .app-name strong {
      display: block;
      font-size: 15px;
      font-weight: 780;
    }

    .app-name span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .status-pill {
      min-height: 25px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      color: var(--accent);
      background: var(--soft);
      font-size: 9px;
      font-weight: 760;
      white-space: nowrap;
    }

    .task-row {
      width: 100%;
      min-height: 44px;
      margin-top: 14px;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
      border-radius: 13px;
      color: var(--ink);
      background: color-mix(in srgb, var(--soft) 65%, white);
      text-align: left;
      cursor: pointer;
    }

    .task-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .task-row span:nth-child(2) {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mini-arrow {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-right: 1.4px solid var(--muted);
      border-top: 1.4px solid var(--muted);
      transform: rotate(45deg);
    }

    .card-footer {
      margin-top: 13px;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
    }

    .message-btn {
      min-width: 0;
      min-height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 10px;
      text-align: left;
      cursor: pointer;
    }

    .message-btn span:last-child {
      max-width: 150px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .unread-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #c96d61;
    }

    .primary-small {
      min-width: 92px;
      min-height: 40px;
      padding: 0 13px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      background: var(--accent);
      font-size: 11px;
      font-weight: 760;
      cursor: pointer;
      box-shadow: 0 8px 18px color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .primary-small:active,
    .primary-btn:active { transform: scale(0.98); }

    .locked-card {
      width: 100%;
      min-height: 74px;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 1px solid var(--line);
      border-radius: 17px;
      color: inherit;
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
      cursor: pointer;
    }

    .locked-card .app-icon {
      width: 38px;
      height: 38px;
      border-color: var(--line);
      color: var(--ink-soft);
      background: var(--surface-soft);
    }

    .locked-copy {
      min-width: 0;
      flex: 1;
    }

    .locked-copy strong {
      display: block;
      font-size: 13px;
      font-weight: 740;
    }

    .locked-copy span {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .locked-label {
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
    }

    .bottom-nav {
      min-height: 66px;
      padding: 7px 48px calc(7px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(18px);
    }

    .home-screen {
      --home-bg: #f5f4f1;
      --home-ink: #172033;
      --home-muted: #81889a;
      background: var(--home-bg);
      color: var(--home-ink);
    }

    .home-screen .scroll {
      background:
        radial-gradient(circle at 8% 0%, rgba(220, 231, 251, 0.46), transparent 24%),
        var(--home-bg);
    }

    .home-screen .home-head {
      min-height: 48px;
      padding: 12px 20px 3px;
      display: block;
      border-bottom: 0;
      background: transparent;
      backdrop-filter: none;
    }

    .home-screen .hotel-switcher {
      min-height: 32px;
      gap: 9px;
    }

    .home-screen .hotel-mark {
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: #102a63;
      box-shadow: none;
      font-size: 8px;
    }

    .home-screen .hotel-title strong {
      max-width: 180px;
      font-size: 12px;
      font-weight: 740;
    }

    .home-screen .hotel-copy small,
    .home-screen .brand-chip {
      display: none;
    }

    .home-hero {
      min-height: 76px;
      padding: 10px 20px 12px;
      display: flex;
      align-items: center;
    }

    .home-hero h1 {
      margin: 0;
      color: var(--home-ink);
      font-size: 24px;
      font-weight: 790;
      letter-spacing: -0.055em;
      line-height: 1.12;
    }

    .home-screen .content {
      padding: 0 20px 24px;
    }

    .home-screen .section + .section {
      margin-top: 23px;
    }

    .home-screen .section-title {
      margin-bottom: 9px;
    }

    .home-screen .section-title h2 {
      font-size: 18px;
      font-weight: 780;
      letter-spacing: -0.035em;
    }

    .home-screen .section-title p,
    .home-screen .section-title .count {
      display: none;
    }

    #prototype-tools {
      display: block;
      width: 100%;
      flex: 0 0 auto;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 0 0 18px 18px;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 14px 34px rgba(24, 39, 64, 0.08);
      backdrop-filter: blur(18px);
    }

    #prototype-tools .demo-state-controls {
      margin: 0;
      padding: 8px 9px;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    #prototype-tools .demo-state-label {
      display: block;
      margin-bottom: 7px;
      color: #81889a;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #prototype-tools .demo-state-options {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #prototype-tools .demo-state-options::-webkit-scrollbar { display: none; }

    #prototype-tools .demo-state-option {
      min-height: 30px;
      padding: 0 7px;
      flex: 0 0 auto;
      border: 1px solid rgba(23, 50, 83, 0.10);
      border-radius: 15px;
      color: #81889a;
      background: rgba(255, 255, 255, 0.72);
      font-size: 9px;
      font-weight: 680;
      cursor: pointer;
    }

    #prototype-tools .demo-state-option.active {
      border-color: rgba(23, 50, 83, 0.16);
      color: #172033;
      background: #fff;
      box-shadow: 0 3px 8px rgba(24, 39, 64, 0.07);
    }

    #prototype-tools .demo-auth-controls {
      margin-top: 10px;
      padding: 14px 9px 8px;
      border-top: 1px solid rgba(23, 50, 83, 0.08);
    }

    .home-screen .app-list {
      gap: 11px;
    }

    .home-screen .app-card {
      height: auto;
      min-height: 0;
      padding: 15px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.74);
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.94), color-mix(in srgb, var(--soft) 66%, white));
      box-shadow: 0 12px 30px rgba(31, 49, 85, 0.07);
    }

    .home-screen .app-card::after {
      content: "";
      width: 100px;
      height: 100px;
      position: absolute;
      right: -38px;
      top: -45px;
      border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      border-radius: 50%;
      box-shadow: 0 0 0 15px color-mix(in srgb, var(--accent) 5%, transparent), 0 0 0 31px color-mix(in srgb, var(--accent) 3%, transparent);
      pointer-events: none;
    }

    .home-screen .app-card-head,
    .home-screen .app-intro,
    .home-screen .app-task-line,
    .home-screen .app-message,
    .home-screen .card-footer {
      position: relative;
      z-index: 1;
    }

    .home-screen .app-card-head {
      gap: 10px;
    }

    .home-screen .app-icon {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.72);
      font-size: 13px;
    }

    .home-screen .app-name strong {
      font-size: 14px;
      font-weight: 760;
    }

    .home-screen .app-name span,
    .home-screen .status-pill {
      display: none;
    }

    .home-screen .app-intro {
      margin: 11px 1px 0;
      color: var(--home-muted);
      font-size: 10px;
      line-height: 1.5;
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .home-screen .task-row {
      min-height: 0;
      margin-top: 14px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
    }

    .home-screen .task-dot,
    .home-screen .task-row .mini-arrow {
      display: none;
    }

    .home-screen .task-row span:nth-child(2) {
      overflow: visible;
      font-size: 13px;
      font-weight: 680;
      line-height: 1.55;
      white-space: normal;
    }

    .home-screen .app-task-line {
      min-height: 44px;
      margin-top: 15px;
      padding: 7px 8px 7px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 14px;
      color: var(--home-ink);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.68), color-mix(in srgb, var(--soft) 28%, transparent));
      box-shadow: inset 3px 0 0 color-mix(in srgb, var(--accent) 52%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.92), 0 5px 16px rgba(24, 39, 64, 0.045);
    }

    .home-screen .app-message {
      min-width: 0;
      margin: 12px 2px 0;
      padding: 9px 1px 0;
      border-top: 1px solid rgba(23, 50, 83, 0.08);
      overflow: hidden;
      color: var(--home-muted);
      font-size: 10px;
      line-height: 1.4;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .home-screen .message-label {
      width: 6px;
      height: 6px;
      display: inline-block;
      vertical-align: 1px;
      margin-right: 7px;
      border-radius: 50%;
      background: #c96d61;
      box-shadow: 0 0 0 3px rgba(201, 109, 97, 0.10);
      font-size: 0;
    }

    .home-screen .app-task-line .task-dot {
      display: block;
    }

    .home-screen .app-task-line .task-copy {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: var(--home-ink);
      font-size: 11px;
      font-weight: 680;
      line-height: 1.4;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .home-screen .app-task-line .primary-small {
      min-width: 74px;
      min-height: 32px;
      padding: 0 10px;
      border-radius: 10px;
      font-size: 9px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 5px 12px color-mix(in srgb, var(--accent) 18%, transparent);
    }

    .home-screen .card-footer {
      display: none;
    }

    .home-screen .message-btn {
      min-height: 38px;
      gap: 6px;
      font-size: 9px;
    }

    .home-screen .message-btn span:last-child {
      max-width: 142px;
    }

    .home-screen .primary-small {
      min-width: 86px;
      min-height: 38px;
      padding: 0 13px;
      border-radius: 13px;
      font-size: 10px;
    }

    .home-locked-grid {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px !important;
    }

    .home-screen .home-locked-grid .locked-card {
      min-height: 74px;
      padding: 12px;
      gap: 9px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.56);
    }

    .home-screen .home-locked-grid .locked-card .app-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      font-size: 11px;
    }

    .home-screen .home-locked-grid .locked-copy strong {
      font-size: 11px;
      font-weight: 720;
    }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function loadState() {
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!saved || !Array.isArray(saved.hotels)) return clone(defaultState);
          var loaded = Object.assign(clone(defaultState), saved, { currentPage: 'home' });
          if (!loaded.hasCompletedOnboarding || !loaded.hotels.length) loaded.isLoggedIn = false;
          return loaded;
        } catch (error) {
          return clone(defaultState);
        }
      }

      var state = loadState();
      var initialDemoMode = new URLSearchParams(window.location.search).get('demo');
      if (initialDemoMode === 'first-login') {
        state = clone(defaultState);
        pendingAuthAction = { type: 'continue' };
        pageBeforeLogin = 'home';
        state.currentPage = 'login';
      } else if (window.location.hash.slice(1) === 'login') {
        pendingAuthAction = { type: 'continue' };
        pageBeforeLogin = 'home';
        state.currentPage = 'login';
      }

      function saveState() {
        var persistable = clone(state);
        persistable.currentPage = 'home';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(persistable));
      }

      function escapeHTML(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getCurrentHotel() {
        return state.hotels.find(function (hotel) {
          return hotel.id === state.currentHotelId;
        }) || state.hotels[0] || null;
      }

      function createHotelApps() {
        var result = {};
        appCatalog.forEach(function (app) {
          result[app.id] = { opened: false, messageRead: false };
        });
        return result;
      }

      function getHotelApps() {
        if (!state.hotelApps[state.currentHotelId]) {
          state.hotelApps[state.currentHotelId] = createHotelApps();
        }
        return state.hotelApps[state.currentHotelId];
      }

      function getApp(appId) {
        return appCatalog.find(function (app) { return app.id === appId; });
      }

      function loginReason(action) {
        var reasons = {
          'hotel-sheet': ['登录后切换酒店', '酒店与应用数据将按你的微信身份保存。'],
          'app-task': ['登录后继续处理任务', '授权成功后将回到刚才选择的应用任务。'],
          'app-detail': ['登录后查看应用', '授权成功后将继续查看或进入该应用。'],
          'mine-page': ['登录后进入管理功能', '酒店、素材、应用和订单需要关联你的微信身份。']
        };
        return reasons[action && action.type] || ['登录后继续使用', '使用微信授权登录，继续管理酒店与应用。'];
      }

      function requireLogin(authAction) {
        if (state.isLoggedIn && state.hasCompletedOnboarding && state.hotels.length) return false;
        pendingAuthAction = authAction || { type: 'continue' };
        pageBeforeLogin = state.currentPage === 'login' ? 'home' : state.currentPage;
        routeStack.push(pageBeforeLogin);
        state.currentPage = 'login';
        window.location.hash = 'login';
        render();
        return true;
      }

      function continueAfterLogin() {
        var action = pendingAuthAction;
        pendingAuthAction = null;
        routeStack = [];
        if (!state.hotels.length) {
          editingHotelId = null;
          pendingLogoData = '';
          return navigate('hotel-form', { replace: true });
        }
        if (!action) return navigate('home', { replace: true });
        if (action.type === 'hotel-sheet') {
          navigate(action.returnPage || 'home', { replace: true });
          return window.setTimeout(function () { openOverlay('hotel-sheet'); }, 0);
        }
        if (action.type === 'app-task') {
          var targetAppState = getHotelApps()[action.appId] || { opened: false };
          if (!targetAppState.opened) {
            selectedAppId = action.appId;
            return navigate('app-detail', { replace: true });
          }
          navigate('home', { replace: true });
          return window.setTimeout(function () { showToast('原型演示：将进入' + getApp(action.appId).name + '处理任务'); }, 0);
        }
        if (action.type === 'app-detail') {
          selectedAppId = action.appId;
          return navigate('app-detail', { replace: true });
        }
        if (action.type === 'mine-page') return navigate(action.page, { replace: true });
        return navigate(pageBeforeLogin || 'home', { replace: true });
      }

      function startFirstHotelCreation() {
        state.isWechatAuthorized = true;
        state.isLoggedIn = false;
        state.hasCompletedOnboarding = false;
        isCreatingFirstHotel = true;
        editingHotelId = null;
        pendingLogoData = '';
        routeStack = [];
        state.currentPage = 'hotel-form';
        window.location.hash = 'hotel-form';
        render();
      }

      function hotelInitials(hotel) {
        if (!hotel || !hotel.name) return '酒店';
        return hotel.name.replace(/酒店/g, '').slice(0, 2) || '酒店';
      }

      function hotelMark(hotel, className) {
        var classes = className || 'hotel-mark';
        if (hotel && hotel.logo) {
          return '<span class="' + classes + '"><img src="' + hotel.logo + '" alt=""></span>';
        }
        return '<span class="' + classes + '">' + escapeHTML(hotelInitials(hotel)) + '</span>';
      }

      function showToast(message) {
        var toast = document.getElementById('toast');
        if (!toast) return;
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = window.setTimeout(function () {
          toast.classList.remove('show');
        }, 1900);
      }

      function navigate(page, options) {
        var settings = options || {};
        if (!settings.replace && state.currentPage !== page) {
          routeStack.push(state.currentPage);
        }
        state.currentPage = page;
        window.location.hash = page;
        render();
      }

      function goBack() {
        var target = routeStack.pop() || 'home';
        state.currentPage = target;
        window.location.hash = target;
        render();
      }

      function pageTop(title) {
        return [

          '<h1>' + escapeHTML(title) + '</h1>',

        root.innerHTML = renderPage() + renderHotelSheet() + renderPurchaseSheet() + renderConfirmSheet('logout') + '<div class="toast" id="toast" role="status" aria-live="polite"></div>';

        prototypeTools.innerHTML = demoStateControls();
        bindDirectEvents();

        if (window.location.hash.slice(1) !== activeRoute) {
          history.replaceState(null, '', '#' + activeRoute);
        }

      function openOverlay(id) {
        var overlay = document.getElementById(id);
        if (overlay) window.requestAnimationFrame(function () { overlay.classList.add('open'); });
      }

      function closeOverlays() {
        document.querySelectorAll('.overlay.open').forEach(function (overlay) {
          overlay.classList.remove('open');
        });
      }

      function switchHotel(hotelId) {
        if (hotelId === state.currentHotelId) {
          closeOverlays();
          showToast('当前正在使用该酒店');
          return;
        }
        var hotel = state.hotels.find(function (item) { return item.id === hotelId; });
        if (!hotel) return;
        state.currentHotelId = hotelId;
        if (!state.hotelApps[hotelId]) state.hotelApps[hotelId] = createHotelApps();
        if (!state.contexts[hotelId]) state.contexts[hotelId] = {};
        saveState();
        closeOverlays();
        render();
        showToast('已切换至' + hotel.name);
      }

      function bindDirectEvents() {
        var hotelForm = document.getElementById('hotel-form');
        if (hotelForm) hotelForm.addEventListener('submit', saveHotelForm);
        var provinceSelect = document.getElementById('hotel-province');
        var citySelect = document.getElementById('hotel-city');
        var districtSelect = document.getElementById('hotel-district');
        if (provinceSelect && citySelect && districtSelect) {
          provinceSelect.addEventListener('change', function () {
            var cities = regionOptions[provinceSelect.value] ? Object.keys(regionOptions[provinceSelect.value]) : [];
            citySelect.innerHTML = selectOptions(cities, '', '请选择');
            districtSelect.innerHTML = selectOptions([], '', '请选择');
          });
          citySelect.addEventListener('change', function () {
            var districts = regionOptions[provinceSelect.value] && regionOptions[provinceSelect.value][citySelect.value] ? regionOptions[provinceSelect.value][citySelect.value] : [];
            districtSelect.innerHTML = selectOptions(districts, '', '请选择');
          });
        }
        var logoInput = document.getElementById('hotel-logo');
        if (logoInput) logoInput.addEventListener('change', previewHotelLogo);
        var contextForm = document.getElementById('context-form');
        if (contextForm) contextForm.addEventListener('submit', saveContext);
        var assetUpload = document.getElementById('asset-upload');
        if (assetUpload) assetUpload.addEventListener('change', uploadAssets);
      }

      function previewHotelLogo(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          pendingLogoData = reader.result;
          var preview = document.getElementById('logo-preview');
          if (preview) preview.innerHTML = '<img src="' + pendingLogoData + '" alt="Logo预览">';
        };
        reader.readAsDataURL(file);
      }

      function saveHotelForm(event) {
        event.preventDefault();
        var formData = new FormData(event.currentTarget);
        var name = String(formData.get('name') || '').trim();
        var province = String(formData.get('province') || '').trim();
        var city = String(formData.get('city') || '').trim();
        var district = String(formData.get('district') || '').trim();
        var detailAddress = String(formData.get('detailAddress') || '').trim();
        var address = province + city + district + detailAddress;
        var hasCompleteAddress = Boolean(province && city && district && detailAddress);
        document.getElementById('hotel-name-error').classList.toggle('show', !name);
        document.getElementById('hotel-address-error').classList.toggle('show', !hasCompleteAddress);
        if (!name || !hasCompleteAddress) {
          showToast('请先完成必填信息');
          return;
        }
        if (isCreatingFirstHotel) {
          var firstHotelId = 'hotel-' + Date.now();
          state.hotels = [{ id: firstHotelId, name: name, province: province, city: city, district: district, detailAddress: detailAddress, address: address, logo: pendingLogoData || '' }];
          state.currentHotelId = firstHotelId;
          state.hotelApps = {};
          state.hotelApps[firstHotelId] = createHotelApps();
          state.contexts = {};
          state.contexts[firstHotelId] = {};
          state.orders = [];
          state.isWechatAuthorized = true;
          state.hasCompletedOnboarding = true;
          state.isLoggedIn = true;
          saveState();
          isCreatingFirstHotel = false;
          editingHotelId = null;
          pendingLogoData = '';
          pendingAuthAction = null;
          routeStack = [];
          navigate('home', { replace: true });
          window.setTimeout(function () { showToast('酒店已创建，登录成功'); }, 20);
          return;
        }
        if (editingHotelId) {
          var hotel = state.hotels.find(function (item) { return item.id === editingHotelId; });
          hotel.name = name;
          hotel.province = province;
          hotel.city = city;
          hotel.district = district;
          hotel.detailAddress = detailAddress;
          hotel.address = address;
          hotel.logo = pendingLogoData || hotel.logo || '';
          saveState();
          editingHotelId = null;
          pendingLogoData = '';
          if (routeStack[routeStack.length - 1] === 'hotel-management') routeStack.pop();
          navigate('hotel-management', { replace: true });
          showToast('酒店资料已保存');
          return;
        }
        var newId = 'hotel-' + Date.now();
        state.hotels.push({ id: newId, name: name, province: province, city: city, district: district, detailAddress: detailAddress, address: address, logo: pendingLogoData || '' });
        state.hotelApps[newId] = createHotelApps();
        state.contexts[newId] = {};
        saveState();
        editingHotelId = null;
        pendingLogoData = '';
        if (routeStack[routeStack.length - 1] === 'hotel-management') routeStack.pop();
        navigate('hotel-management', { replace: true });
        showToast('酒店已新增，可切换后使用');
      }

      function saveContext(event) {
        event.preventDefault();
        var formData = new FormData(event.currentTarget);
        var context = {};
        formData.forEach(function (value, key) { context[key] = String(value).trim(); });
        state.contexts[state.currentHotelId] = context;
        saveState();
        showToast('酒店 Context 已保存');
      }

      function uploadAssets(event) {
        var files = Array.prototype.slice.call(event.target.files || []);
        if (!files.length) return;
        var assetStore = transientAssets;
        if (!assetStore[state.currentHotelId]) assetStore[state.currentHotelId] = [];
        var remaining = files.length;
        files.forEach(function (file) {
          var reader = new FileReader();
          reader.onload = function () {
            assetStore[state.currentHotelId].push({ name: file.name, url: reader.result });
            remaining -= 1;
            if (remaining === 0) {
              render();
              showToast('图片已加入当前酒店');
            }
          };
          reader.readAsDataURL(file);
        });
      }

      document.addEventListener('click', function (event) {
        var target = event.target.closest('[data-action]');
        if (!target) {
          if (event.target.classList.contains('overlay')) closeOverlays();
          return;
        }
        var action = target.dataset.action;
        if (action === 'back') return goBack();
        if (action === 'nav-home') return navigate('home');
        if (action === 'nav-mine') return navigate('mine');
        if (action === 'navigate') {
          if (requireLogin({ type: 'mine-page', page: target.dataset.page })) return;
          return navigate(target.dataset.page);
        }
        if (action === 'set-demo-state') {
          demoHomeState = target.dataset.demoState || 'both';
          return render();
        }
        if (action === 'demo-first-login') {
          state = clone(defaultState);
          isCreatingFirstHotel = false;
          editingHotelId = null;
          pendingLogoData = '';
          pendingAuthAction = { type: 'continue' };
          pageBeforeLogin = 'home';
          routeStack = [];
          state.currentPage = 'login';
          window.location.hash = 'login';
          return render();
        }
        if (action === 'demo-returning-login') {
          if (!state.hotels.length) state.hotels = clone(defaultState.hotels);
          state.currentHotelId = state.hotels[0].id;
          if (!state.hotelApps[state.currentHotelId]) state.hotelApps[state.currentHotelId] = createHotelApps();
          state.isWechatAuthorized = false;
          state.hasCompletedOnboarding = true;
          state.isLoggedIn = false;
          isCreatingFirstHotel = false;
          pendingAuthAction = { type: 'continue' };
          pageBeforeLogin = 'home';
          routeStack = [];
          state.currentPage = 'login';
          window.location.hash = 'login';
          return render();
        }
        if (action === 'open-hotel-sheet') {
          if (requireLogin({ type: 'hotel-sheet', returnPage: state.currentPage })) return;
          return openOverlay('hotel-sheet');
        }
        if (action === 'close-overlay') return closeOverlays();
        if (action === 'switch-hotel') return switchHotel(target.dataset.hotelId);
        if (action === 'open-hotel-management') {
          closeOverlays();
          return navigate('hotel-management');
        }
        if (action === 'add-hotel') {
          editingHotelId = null;
          pendingLogoData = '';
          return navigate('hotel-form');
        }
        if (action === 'edit-hotel') {
          editingHotelId = target.dataset.hotelId;
          pendingLogoData = '';
          return navigate('hotel-form');
        }
        if (action === 'app-detail') {
          if (requireLogin({ type: 'app-detail', appId: target.dataset.appId })) return;
          selectedAppId = target.dataset.appId;
          return navigate('app-detail');
        }
        if (action === 'delete-asset') {
          var deleteList = transientAssets[state.currentHotelId] || [];
          var deleteIndex = Number(target.dataset.assetIndex);
          if (deleteIndex >= 0 && deleteIndex < deleteList.length) {
            deleteList.splice(deleteIndex, 1);
            render();
            showToast('素材已删除');
          }
          return;
        }
        if (action === 'open-purchase-sheet') {
          selectedAppId = target.dataset.appId;
          return openOverlay('purchase-sheet');
        }
        if (action === 'confirm-purchase') {
          var purchaseId = target.dataset.appId;
          getHotelApps()[purchaseId] = { opened: true, messageRead: false };
          state.orders.unshift({
            id: 'order-' + Date.now(),
            hotelId: state.currentHotelId,
            appId: purchaseId,
            createdLabel: '刚刚'
          });
          saveState();
          closeOverlays();
          render();
          showToast(getApp(purchaseId).name + '已开通（原型演示）');
          return;
        }
        if (action === 'open-app') {
          if (requireLogin({ type: 'app-detail', appId: target.dataset.appId })) return;
          return showToast('原型演示：将进入' + getApp(target.dataset.appId).name);
        }
        if (action === 'open-task') {
          if (requireLogin({ type: 'app-task', appId: target.dataset.appId })) return;
          return showToast('原型演示：将进入' + getApp(target.dataset.appId).name + '处理任务');
        }
        if (action === 'read-message') {
          getHotelApps()[target.dataset.appId].messageRead = true;
          saveState();
          render();
          showToast('消息已读，任务状态不受影响');
          return;
        }
        if (action === 'save-qr') {
          return showToast('原型演示：企业微信二维码待替换');
        }
        if (action === 'logout') return openOverlay('confirm-sheet');
        if (action === 'confirm-logout') {
          closeOverlays();
          routeStack = [];
          state.isLoggedIn = false;
          pendingAuthAction = null;
          state.currentPage = 'home';
          saveState();
          render();
          showToast('已退出登录');
          return;
        }
        if (action === 'cancel-login') {
          pendingAuthAction = null;
          routeStack = [];
          state.currentPage = pageBeforeLogin || 'home';
          window.location.hash = state.currentPage;
          return render();
        }
        if (action === 'cancel-onboarding') {
          isCreatingFirstHotel = false;
          state.isWechatAuthorized = false;
          state.isLoggedIn = false;
          state.hasCompletedOnboarding = false;
          pendingAuthAction = null;
          routeStack = [];
          state.currentPage = 'home';
          window.location.hash = 'home';
          return render();
        }
        if (action === 'wechat-login') {
          target.disabled = true;
          target.innerHTML = '<span class="spinner"></span> 正在授权';
          window.setTimeout(function () {
            state.isWechatAuthorized = true;
            if (!state.hasCompletedOnboarding) {
              startFirstHotelCreation();
              window.setTimeout(function () { showToast('微信授权成功，请创建酒店'); }, 20);
              return;
            }
            if (!state.hotels.length) {
              startFirstHotelCreation();
              window.setTimeout(function () { showToast('请先创建至少一家酒店'); }, 20);
              return;
            }
            state.isLoggedIn = true;
            saveState();
            continueAfterLogin();
            window.setTimeout(function () { showToast('微信授权登录成功'); }, 20);
          }, 650);
        }
      });

      window.addEventListener('hashchange', function () {
        var route = window.location.hash.slice(1);
        var allowed = ['home', 'mine', 'hotel-management', 'hotel-form', 'assets', 'subscriptions', 'orders', 'customer', 'app-detail', 'login'];
        if (allowed.indexOf(route) !== -1 && route !== state.currentPage) {
          state.currentPage = route;
          render();
        }
      });

      render();
    }());
  </script>
</body>
</html>
